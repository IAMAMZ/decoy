[project]
name = "boson-ai-hackathon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.4",
    "greenlet>=3.2.4",
    "playwright>=1.55.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "uvicorn>=0.32.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # formatter owns line length

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
