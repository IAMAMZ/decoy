<!doctype html>
<!-- Decoy's start page: what the real Chrome shows before it has anything to check.
     Served inside the browser at START_URL (backend/browser.py); shown as decoy://standby. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decoy · standing by</title>
<style>
  :root { --ink: #1b1b19; --muted: #6f6c64; --line: #dcd9d1; --accent: #ff5b37; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #f6f5f1; color: var(--ink);
    font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(560px, 86vw); text-align: center; }
  .mark { color: var(--ink); width: 56px; height: 56px; }
  .name { margin: 6px 0 28px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 14px; color: var(--muted); background: #fff;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  h1 { margin: 22px 0 10px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0 auto; max-width: 440px; color: var(--muted); }
  ul { display: flex; justify-content: center; gap: 10px; margin: 28px 0 0; padding: 0; list-style: none; }
  li { padding: 6px 12px; border-radius: 8px; background: #ebe9e3; font-size: 13px; color: var(--ink); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path fill="currentColor" fill-rule="evenodd" d="M20.5 5.5a5 5 0 0 1 4.9 4h4.1l-3.9 2.6a5 5 0 0 1-1.6 2.6c2.4.9 3.5 2.8 3.5 5 0 3.2-3 5.3-7 5.3H9c-3.8 0-6.5-2.3-6.5-5.6 0-.9.1-1.8.4-2.6L1 12.5l5.2 2.4c1-.4 2.2-.6 3.5-.6h7.8a5 5 0 0 1 3-8.8zm.7 3.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/>
    <path d="M2 29h28" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  </svg>
  <div class="name">Decoy</div>
  <span class="status"><span class="dot"></span>Standing by</span>
  <h1>Nothing to check yet</h1>
  <p>When the caller names a bank or gives a link, Decoy opens the official source here and checks it live.</p>
  <ul>
    <li>Caller ID vs. official number</li>
    <li>The bank's own rules</li>
    <li>Links and domains</li>
  </ul>
</main>
</body>
</html>
