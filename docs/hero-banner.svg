<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0e0d" />
      <stop offset="60%" stop-color="#141413" />
      <stop offset="100%" stop-color="#191412" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5b37" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff5b37" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5b37" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff5b37" />
    </linearGradient>
    <style>
      .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes ringPulse {
        0% { r: 9px; opacity: 0.75; }
        100% { r: 22px; opacity: 0; }
      }
      @keyframes waveBar {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes meterClimb {
        0%, 15% { width: 68px; }
        45%, 60% { width: 175px; }
        80%, 100% { width: 242px; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -24; }
      }
      .live-dot { animation: pulseDot 1.8s ease-in-out infinite; transform-origin: center; }
      .radar-pulse { animation: ringPulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: flowDash 1.2s linear infinite; }
      .w1 { animation: waveBar 0.9s ease-in-out infinite 0.0s; transform-box: fill-box; transform-origin: center; }
      .w2 { animation: waveBar 0.9s ease-in-out infinite 0.15s; transform-box: fill-box; transform-origin: center; }
      .w3 { animation: waveBar 0.9s ease-in-out infinite 0.3s; transform-box: fill-box; transform-origin: center; }
      .w4 { animation: waveBar 0.9s ease-in-out infinite 0.45s; transform-box: fill-box; transform-origin: center; }
      .w5 { animation: waveBar 0.9s ease-in-out infinite 0.2s; transform-box: fill-box; transform-origin: center; }
      .w6 { animation: waveBar 0.9s ease-in-out infinite 0.35s; transform-box: fill-box; transform-origin: center; }
      .w7 { animation: waveBar 0.9s ease-in-out infinite 0.1s; transform-box: fill-box; transform-origin: center; }
      .meter-anim { animation: meterClimb 6s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="380" rx="14" fill="url(#bgGrad)" stroke="#2a2a27" stroke-width="2" />
  <rect x="1" y="1" width="520" height="378" rx="13" fill="url(#orangeGlow)" />

  <!-- Top Header Bar -->
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#2a2a27" stroke-width="1" />

  <!-- Decoy Radar Logo -->
  <g transform="translate(42, 34)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff5b37" stroke-width="1.8" opacity="0.45" />
    <circle class="radar-pulse" cx="0" cy="0" r="9" fill="none" stroke="#ff5b37" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8.5" fill="none" stroke="#ff5b37" stroke-width="1.8" />
    <circle cx="0" cy="0" r="3.5" fill="#ff5b37" />
  </g>
  <text x="68" y="40" fill="#ecebe6" class="sans" font-size="20" font-weight="600" letter-spacing="-0.02em">Decoy</text>
  <text x="136" y="40" fill="#9b998f" class="mono" font-size="13">AI Fraud Interceptor · Boson Higgs Stack</text>

  <!-- Live Status Pill -->
  <g transform="translate(888, 19)">
    <rect width="276" height="30" rx="6" fill="#1d1d1b" stroke="#2a2a27" />
    <circle class="live-dot" cx="16" cy="15" r="4.5" fill="#8dbf7f" />
    <text x="30" y="19" fill="#c8c6bf" class="mono" font-size="12">LIVE · ~0.48s VOICE ROUND TRIP</text>
  </g>

  <!-- Hero Headline Block -->
  <text x="36" y="118" fill="#ecebe6" class="sans" font-size="31" font-weight="600" letter-spacing="-0.025em">
    Every scam call Decoy takes is a call a real customer doesn’t.
  </text>
  <text x="36" y="148" fill="#9b998f" class="sans" font-size="16">
    Listens silently, verifies bank claims in a real Chrome browser, clones the customer’s voice on the fly, and takes over to bait the scammer.
  </text>

  <!-- Flow Connectors -->
  <line class="flow-line" x1="392" y1="262" x2="424" y2="262" stroke="#ff5b37" stroke-width="2" />
  <line class="flow-line" x1="776" y1="262" x2="808" y2="262" stroke="#ff5b37" stroke-width="2" />

  <!-- Stage 1 Card: Silent Monitoring & Voice Clone -->
  <g transform="translate(36, 178)">
    <rect width="356" height="168" rx="10" fill="#151514" stroke="#2a2a27" stroke-width="1.5" />
    <text x="20" y="30" fill="#9b998f" class="mono" font-size="11" letter-spacing="0.05em">01 · MONITOR &amp; CLONE</text>
    <rect x="242" y="15" width="94" height="22" rx="4" fill="#1d1d1b" stroke="#2a2a27" />
    <text x="253" y="30" fill="#8dbf7f" class="mono" font-size="11">8.0s CLONED</text>

    <text x="20" y="58" fill="#ecebe6" class="sans" font-size="16" font-weight="600">Higgs Analyst + Instant Voice Twin</text>
    <text x="20" y="80" fill="#9b998f" class="sans" font-size="13">Scores each turn via <tspan class="mono" fill="#c8c6bf">analyze_turn</tspan> while cloning</text>
    <text x="20" y="98" fill="#9b998f" class="sans" font-size="13">the customer’s real voice from their first turns.</text>

    <!-- Animated Waveform Box -->
    <rect x="20" y="114" width="316" height="36" rx="6" fill="#0e0e0d" stroke="#2a2a27" />
    <text x="34" y="136" fill="#c8c6bf" class="mono" font-size="11">VOICE SAMPLE</text>
    <g transform="translate(150, 121)" fill="#ff5b37">
      <rect class="w1" x="0" y="0" width="4" height="22" rx="2" />
      <rect class="w2" x="10" y="0" width="4" height="22" rx="2" />
      <rect class="w3" x="20" y="0" width="4" height="22" rx="2" />
      <rect class="w4" x="30" y="0" width="4" height="22" rx="2" />
      <rect class="w5" x="40" y="0" width="4" height="22" rx="2" />
      <rect class="w6" x="50" y="0" width="4" height="22" rx="2" />
      <rect class="w7" x="60" y="0" width="4" height="22" rx="2" />
      <rect class="w2" x="70" y="0" width="4" height="22" rx="2" />
      <rect class="w4" x="80" y="0" width="4" height="22" rx="2" />
    </g>
    <text x="262" y="136" fill="#8dbf7f" class="mono" font-size="11">READY ✓</text>
  </g>

  <!-- Stage 2 Card: Real Chrome Verification & Protect -->
  <g transform="translate(422, 178)">
    <rect width="356" height="168" rx="10" fill="#151514" stroke="#2a2a27" stroke-width="1.5" />
    <text x="20" y="30" fill="#ff5b37" class="mono" font-size="11" letter-spacing="0.05em">02 · PROTECT &amp; VERIFY IN CHROME</text>
    <rect x="260" y="15" width="76" height="22" rx="4" fill="#1d1d1b" stroke="#ff5b37" stroke-opacity="0.5" />
    <text x="271" y="30" fill="#ecebe6" class="mono" font-size="11">SCORE ≥ 0.6</text>

    <text x="20" y="58" fill="#ecebe6" class="sans" font-size="16" font-weight="600">Live Browser Evidence + Auto-Freeze</text>
    <text x="20" y="80" fill="#9b998f" class="sans" font-size="13">Opens <tspan class="mono" fill="#c8c6bf">rbc.com</tspan> &amp; RDAP in headless Chrome, highlights</text>
    <text x="20" y="98" fill="#9b998f" class="sans" font-size="13">fraud rules, freezes transfers, and pushes a family alert.</text>

    <!-- Animated Scam Confidence Meter -->
    <rect x="20" y="114" width="316" height="36" rx="6" fill="#0e0e0d" stroke="#2a2a27" />
    <text x="32" y="136" fill="#9b998f" class="mono" font-size="11">RISK</text>
    <rect x="72" y="127" width="246" height="10" rx="3" fill="#1d1d1b" />
    <rect class="meter-anim" x="72" y="127" width="242" height="10" rx="3" fill="url(#barFill)" />
  </g>

  <!-- Stage 3 Card: Takeover & Dynamic Dossier -->
  <g transform="translate(808, 178)">
    <rect width="356" height="168" rx="10" fill="#151514" stroke="#ff5b37" stroke-width="1.5" />
    <text x="20" y="30" fill="#ff5b37" class="mono" font-size="11" letter-spacing="0.05em">03 · TAKEOVER &amp; INTEL REPORT</text>
    <rect x="252" y="15" width="84" height="22" rx="4" fill="#ff5b37" />
    <text x="263" y="30" fill="#0e0e0d" class="mono" font-size="11" font-weight="600">TAKEOVER</text>

    <text x="20" y="58" fill="#ecebe6" class="sans" font-size="16" font-weight="600">Stall Scammer · Extract Mule Accounts</text>
    <text x="20" y="80" fill="#9b998f" class="sans" font-size="13">Customer taps <tspan fill="#ecebe6" font-weight="600">Take over</tspan>; Decoy speaks in their cloned</text>
    <text x="20" y="98" fill="#9b998f" class="sans" font-size="13">voice, extracts mule accounts &amp; writes a live dossier.</text>

    <!-- Captured Intel Pill -->
    <rect x="20" y="114" width="316" height="36" rx="6" fill="#0e0e0d" stroke="#2a2a27" />
    <text x="32" y="136" fill="#9b998f" class="mono" font-size="11">CAPTURED</text>
    <text x="104" y="136" fill="#ff5b37" class="mono" font-size="11">00427719385 · rbc-secure-verify.com</text>
  </g>
</svg>
